services:
  bank-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-frontend:latest
    container_name: bank-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-7081}:${PORT:-7081}"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    external: true
